name: Documentation

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
  schedule:
    - cron: '0 0 1 * *'  # Runs at midnight UTC on the 1st of every month
  workflow_dispatch:       # Allows manual trigger from the Actions tab

concurrency:
  # One build per branch at a time; cancel superseded pull-request builds.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build:
    permissions:
      actions: write        # julia-actions/cache deletes the old caches it created
      contents: write       # push the built site to gh-pages
      pull-requests: read
      statuses: write       # commit statuses for pull-request previews
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.Registry.update(); Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # If authenticating with GitHub Actions token
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # If authenticating with SSH deploy key
        run: julia --project=docs/ docs/make.jl
